<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0b0e13">
<title>Kazı Kazan — Sırrı Keşfet</title>
<style>
  :root{
    --bg:#0b0e13;
    --bg2:#11161d;
    --card:#151b24;
    --line:#242e3b;
    --text:#e8edf4;
    --muted:#8b97a8;
    --accent:#e6b450;
    --accent2:#f3d9a0;
    --ok:#3ecf8e;
    --danger:#e5484d;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, #1a2330 0%, transparent 60%),
      radial-gradient(900px 500px at 85% 110%, #1a2330 0%, transparent 55%),
      var(--bg);
    color:var(--text);
    min-height:100dvh;
    display:flex;
    flex-direction:column;
    align-items:center;
    padding:env(safe-area-inset-top) 16px env(safe-area-inset-bottom);
    -webkit-user-select:none;user-select:none;
    touch-action:manipulation;
    overflow-x:hidden;
  }
  header{width:100%;max-width:430px;text-align:center;padding:26px 0 8px}
  .badge{
    display:inline-flex;align-items:center;gap:8px;
    font-size:11px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
    color:var(--accent);background:rgba(230,180,80,.08);
    border:1px solid rgba(230,180,80,.25);
    border-radius:999px;padding:6px 14px;margin-bottom:14px;
  }
  .badge .dot{width:6px;height:6px;border-radius:50%;background:var(--accent);box-shadow:0 0 8px var(--accent);animation:pulse 2s infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
  h1{font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.15}
  h1 .hint{color:var(--muted)}
  p.sub{margin-top:8px;font-size:14px;color:var(--muted);line-height:1.5;max-width:320px;margin-left:auto;margin-right:auto}
  p.sub b{color:var(--text);font-weight:600}

  /* ── Card ──────────────────────────────── */
  .card-wrap{
    width:100%;max-width:430px;
    margin:20px auto 0;
    perspective:1200px;
  }
  .card{
    position:relative;
    border-radius:22px;
    overflow:hidden;
    background:var(--card);
    border:1px solid var(--line);
    box-shadow:0 24px 60px -18px rgba(0,0,0,.65), 0 4px 14px rgba(0,0,0,.35);
    transform:rotateX(1.5deg);
    transition:transform .45s cubic-bezier(.2,.8,.25,1), box-shadow .45s;
  }
  .card-wrap.scratching .card{transform:rotateX(0) scale(.995);box-shadow:0 10px 34px -12px rgba(0,0,0,.7)}
  .card-wrap.done .card{transform:rotateX(0) scale(1);box-shadow:0 30px 70px -16px rgba(0,0,0,.75)}
  .card-wrap.done .card{animation:reveal .7s cubic-bezier(.2,.9,.3,1.2) .15s both}
  @keyframes reveal{from{transform:rotateX(8deg) scale(.97)}to{transform:rotateX(0) scale(1)}}

  .stage{
    position:relative;
    width:100%;
    aspect-ratio:714/1280;
    background:#000;
    touch-action:none;
  }
  .layer{position:absolute;inset:0;width:100%;height:100%;display:block}
  .prize{object-fit:cover}
  canvas#scratch{position:absolute;inset:0;width:100%;height:100%;display:block}
  .shine{
    position:absolute;inset:0;pointer-events:none;mix-blend-mode:overlay;
    background:linear-gradient(115deg, rgba(255,255,255,.14) 0%, transparent 28%, transparent 70%, rgba(255,255,255,.05) 100%);
  }

  /* progress chip */
  .prog{
    position:absolute;top:10px;right:10px;z-index:5;
    display:flex;align-items:center;gap:6px;
    background:rgba(11,14,19,.72);backdrop-filter:blur(8px);
    border:1px solid rgba(255,255,255,.14);
    border-radius:999px;padding:6px 12px;
    font-size:12px;font-weight:700;color:var(--text);
    pointer-events:none;
    transition:opacity .4s;
  }
  .prog .pct{color:var(--accent)}
  .prog.hidden{opacity:0}
  .prog .bar{
    width:44px;height:4px;border-radius:99px;background:rgba(255,255,255,.16);overflow:hidden;
  }
  .prog .bar i{
    display:block;height:100%;width:0%;border-radius:99px;
    background:linear-gradient(90deg,var(--accent),var(--accent2));
    transition:width .25s ease;
  }

  /* scratch hint */
  .hint-cloud{
    position:absolute;inset:0;z-index:6;display:flex;align-items:center;justify-content:center;
    pointer-events:none;transition:opacity .5s;opacity:1;
  }
  .hint-cloud.fade{opacity:0}
  .hint-pill{
    display:inline-flex;align-items:center;gap:10px;
    background:rgba(11,14,19,.55);backdrop-filter:blur(10px);
    border:1px solid rgba(255,255,255,.16);
    border-radius:999px;padding:11px 20px;
    font-size:14px;font-weight:700;color:#fff;
    box-shadow:0 10px 30px rgba(0,0,0,.4);
    animation:float 2.6s ease-in-out infinite;
  }
  .hint-pill svg{flex:none}
  @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
  .hint-pill .spark{color:var(--accent2);font-size:16px}

  /* done overlay */
  .done-overlay{
    position:absolute;inset:0;z-index:7;display:none;
    align-items:flex-end;justify-content:center;
    background:linear-gradient(to top, rgba(0,0,0,.72) 0%, rgba(0,0,0,.25) 38%, transparent 65%);
    padding-bottom:26px;
    pointer-events:none;
  }
  .card-wrap.done .done-overlay{display:flex;animation:fadeUp .6s ease .35s both}
  @keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  .done-chip{
    display:flex;align-items:center;gap:8px;
    background:rgba(62,207,142,.14);border:1px solid rgba(62,207,142,.45);
    color:var(--ok);border-radius:999px;padding:9px 18px;
    font-size:13px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;
    backdrop-filter:blur(8px);
  }

  /* ── Controls ─────────────────────────── */
  .controls{
    width:100%;max-width:430px;
    display:flex;flex-direction:column;align-items:center;gap:14px;
    padding:22px 0 10px;
  }
  .btn{
    display:inline-flex;align-items:center;justify-content:center;gap:9px;
    border:none;cursor:pointer;font-family:inherit;
    border-radius:14px;padding:14px 26px;
    font-size:15px;font-weight:700;letter-spacing:.01em;
    transition:transform .15s ease, box-shadow .15s ease, opacity .2s;
  }
  .btn:active{transform:scale(.97)}
  .btn-primary{
    background:linear-gradient(135deg,var(--accent),#d9a53f);
    color:#1c1405;box-shadow:0 10px 26px -8px rgba(230,180,80,.5);
  }
  .btn-primary:hover{box-shadow:0 14px 32px -8px rgba(230,180,80,.65)}
  .btn-ghost{
    background:transparent;color:var(--muted);
    border:1px solid var(--line);font-size:13px;padding:10px 18px;border-radius:11px;
  }
  .btn-ghost:hover{color:var(--text);border-color:#3a4a5e}

  footer{
    width:100%;max-width:430px;text-align:center;
    padding:6px 0 22px;font-size:12px;color:#5c6a7c;line-height:1.6;
  }
  footer .rules{color:var(--muted)}
</style>
</head>
<body>

<header>
  <div class="badge"><span class="dot"></span> Kazı Kazan ·@ Gizli Sürpriz</div>
  <h1>Parmağını gezdir, <span class="hint">sırrı açığa çıkar</span></h1>
  <p class="sub">Bulutların ardında bir görsel saklı. <b>Dokun ve sürükle</b> – bulutları kazı, gergçğ gör.</p>
</header>

<div class="card-wrap" id="wrap">
  <div class="card">
    <div class="stage" id="stage">
      <img class="layer prize" id="prize" src="images/secret.jpg" alt="Gizli görsel" draggable="false">
      <canvas id="scratch"></canvas>
      <div class="shine"></div>
      <div class="prog" id="prog"><div class="bar"><i id="progFill"></i></div><span id="progText">%0</span></div>
      <div class="hint-cloud" id="hint">
        <div class="hint-pill">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#f3d9a0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a7 7 0 0 0-4 12.7c.6.5 1 1.4 1 2.3h6c0-.9.4-1.8 1-2.3A7 7 0 0 0 12 2z"/><path d="M9 22h6"/></svg>
          <span class="spark">✦</span> Kazımaya başla
          <span class="spark">✦</span>
        </div>
      </div>
      <div class="done-overlay" id="doneOverlay">
        <div class="done-chip">✓ Sır açığa çıktı</div>
      </div>
    </div>
  </div>
</div>

<div class="controls">
  <button class="btn btn-primary" id="againBtn">
    <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg>
    Tekrar Kazı
  </button>
  <button class="btn btn-ghost" id="resetBtn">Bulutları Geri Getir</button>
</div>

<footer>
  <div class="rules">Parmak ya da fare ile sürükle – her geçiş bulutları siler.</div>
  <div>Gizem açığa çıkmayı bekliyor 🎭</div>
</footer>

<script>
(function(){
  'use strict';

  var stage  = document.getElementById('stage');
  var canvas = document.getElementById('scratch');
  var ctx    = canvas.getContext('2d', { willReadFrequently: true });
  var wrap    = document.getElementById('wrap');
  var hint   = document.getElementById('hint');
  var progEl = document.getElementById('prog');
  var progText = document.getElementById('progText');
  var progFill = document.getElementById('progFill');
  var againBtn = document.getElementById('againBtn');
  var resetBtn = document.getElementById('resetBtn');
  /* "Voilà!" reveal sound (fr-FR TTS) */
  var voilaEl = new Audio('images/voila.mp3');
  voilaEl.preload = 'auto';
  var voilaUnlocked = false;
  function unlockVoila(){
    if(voilaUnlocked) return;
    try{
      voilaEl.muted = true;
      var p = voilaEl.play();
      var done = function(){ voilaEl.pause(); voilaEl.currentTime = 0; voilaEl.muted = false; voilaUnlocked = true; };
      if(p && p.then){ p.then(done, done); } else { done(); }
    }catch(e){ voilaEl.muted = false; }
  }
  function playVoila(){
    try{
      voilaEl.muted = false;
      voilaEl.currentTime = 0;
      var p = voilaEl.play();
      if(p && p.catch) p.catch(function(){});
    }catch(e){}
  }

  var clouds = new Image();
  var prize  = document.getElementById('prize');
  var CLOUD_SRC = 'images/cloud_texture.png';
  var SCRATCH_W = 1000;   // fixed logical canvas width
  var SCRATCH_H = 1792;   // ~ 714/1280 ratio × 1000 (rounded)
  var brushR = 52;

  var W=0, H=0, dpr=1, erased=0, total=0, revealed=false, cloudLoaded=false, prizeLoaded=false;
  var drawing=false, lastX=0, lastY=0, raf=false, needsInit=true;

  /* ── helpers ─────────────────────────── */
  function rand(a,b){ return a + Math.random()*(b-a); }

  function fillClouds(w,h){
    ctx.fillStyle = '#b9c6d6';
    ctx.fillRect(0,0,w,h);
    if(!cloudLoaded){ return; }
    var tw = clouds.width, th = clouds.height;
    var ox = rand(0,tw), oy = rand(0,th);
    /* robust tiling: start one tile before the origin so large random
       offsets can never leave an uncovered gap (tiles can exceed canvas) */
    for(var r=-1; r*th - oy < h; r++){
      for(var c=-1; c*tw - ox < w; c++){
        ctx.drawImage(clouds, (c*tw - ox), (r*th - oy));
      }
    }
  }

  function showHint(on){
    hint.classList.toggle('fade', !on);
    hint.style.pointerEvents = on ? 'none' : 'none';
  }

  function refreshPct(){
    if(!total){ progText.textContent = '%0'; progFill.style.width = '0%'; return; }
    var p = Math.min(100, Math.round(erased/total*100));
    progText.textContent = '%' + p;
    progFill.style.width = p + '%';
  }

  function computeErased(){
    var img = ctx.getImageData(0,0,W,H).data;
    var n=0, i=0, step=32;
    for(var y=0;y<H;y+=step){
      for(var x=0;x<W;x+=step){
        var a = img[(y*W+x)*4+3];
        if(a < 128){ n++; }
        i++;
      }
    }
    erased = n; total = i;
    refreshPct();
    if(!revealed && n/i >= 0.42){
      reveal();
    }
  }

  function reveal(){
    revealed = true;
    playVoila();
    wrap.classList.add('done');
    progEl.classList.add('hidden');
    showHint(false);
    ctx.globalCompositeOperation = 'destination-out';
    ctx.fillStyle = 'rgba(0,0,0,1)';
    ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation = 'source-over';
  }

  /* ── pointer (mouse + touch) ──────────── */
  function getPos(e){
    var rect = canvas.getBoundingClientRect();
    var x = (e.clientX - rect.left) * (W/rect.width);
    var y = (e.clientY - rect.top)  * (H/rect.height);
    return {x:x, y:y};
  }

  function scratchFrom(x1,y1,x2,y2){
    var dx = x2-x1, dy = y2-y1, dist = Math.sqrt(dx*dx+dy*dy);
    var steps = Math.max(1, Math.floor(dist/6));
    ctx.save();
    ctx.globalCompositeOperation = 'destination-out';
    ctx.lineCap='round'; ctx.lineJoin='round';
    for(var i=0;i<=steps;i++){
      var t = i/steps;
      var x = x1+dx*t, y = y1+dy*t;
      ctx.beginPath();
      ctx.arc(x, y, brushR, 0, Math.PI*2);
      ctx.fill();
    }
    ctx.lineWidth = brushR*2;
    ctx.restore();
    erased += steps*3 + 6;
    refreshPct();
    /* reveal threshold guard: total must be set (prevents Infinity on first tap) */
    if(!revealed && total > 0 && erased/total >= 0.42){ reveal(); }
  }

  canvas.addEventListener('pointerdown', function(e){
    if(revealed) return;
    unlockVoila();
    e.preventDefault();
    drawing = true;
    var p = getPos(e);
    lastX = p.x; lastY = p.y;
    showHint(false);
    wrap.classList.add('scratching');
    try{ canvas.setPointerCapture(e.pointerId); }catch(err){}
    scratchFrom(lastX, lastY, lastX+0.01, lastY+0.01);
  });

  canvas.addEventListener('pointermove', function(e){
    if(!drawing || revealed) return;
    e.preventDefault();
    var p = getPos(e);
    if(!raf){
      raf = true;
      requestAnimationFrame(function(){
        raf = false;
        scratchFrom(lastX, lastY, p.x, p.y);
        lastX = p.x; lastY = p.y;
      });
    }
  });

  function endStroke(e){
    if(!drawing) return;
    drawing = false;
    wrap.classList.remove('scratching');
    try{ canvas.releasePointerCapture(e.pointerId); }catch(err){}
    if(!revealed) computeErased();
  }
  canvas.addEventListener('pointerup', endStroke);
  canvas.addEventListener('pointercancel', endStroke);

  /* ── resize / init ───────────────────── */
  function resize(){
    var rect = stage.getBoundingClientRect();
    dpr = Math.min(2, window.devicePixelRatio || 1);
    W = Math.round(rect.width * dpr);
    H = Math.round(rect.height * dpr);
    canvas.width = W; canvas.height = H;
    ctx.setTransform(1,0,0,1,0,0);
    fillClouds(W,H);
    erased=0; total=0; revealed=false;
    wrap.classList.remove('done','scratching');
    progEl.classList.remove('hidden');
    refreshPct();
    needsInit = false;
  }

  function scheduleResize(){
    if(!needsInit) return;
    resize();
  }

  /* ── boot ─────────────────────────────── */
  function boot(){
    if(!cloudLoaded && clouds.complete && clouds.naturalWidth > 0){
      cloudLoaded = true;
    }
    if(!cloudLoaded){
      clouds.onload = function(){
        cloudLoaded = true;
        resize();
      };
      clouds.onerror = function(){
        cloudLoaded = false;
        resize();
      };
      clouds.src = CLOUD_SRC;
      return;
    }
    resize();
  }

  /* ── actions ──────────────────────────── */
  function resetScratch(){
    voilaEl.pause();
    voilaEl.currentTime = 0;
    wrap.classList.remove('done','scratching');
    revealed = false;
    progEl.classList.remove('hidden');
    showHint(true);
    resize();
  }

  againBtn.addEventListener('click', resetScratch);
  resetBtn.addEventListener('click', resetScratch);

  window.addEventListener('resize', scheduleResize);
  window.addEventListener('orientationchange', function(){ setTimeout(resize, 300); });

  if(document.readyState === 'complete' || document.readyState === 'interactive'){
    boot();
  } else {
    window.addEventListener('DOMContentLoaded', boot);
  }
})();
</script>
</body>
</html>
